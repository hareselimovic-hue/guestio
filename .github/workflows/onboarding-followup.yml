name: Onboarding follow-up emails

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC = 08:00 Sarajevo (winter), 09:00 (summer)
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call onboarding follow-up endpoint
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://app.smartstay.ba/api/cron/onboarding-followup
